# Window rules

# KeePassXC scratchpad (SUPER+p)
window_rule=is_named_scratchpad:1,width:900,height:600,shield_when_capture:1,app_id:org.keepassxc.KeePassXC

# Firefox on tag 1; Picture-in-Picture floats above everything on all tags
window_rule=tags:1,app_id:[Ff]irefox
window_rule=is_floating:1,is_global:1,is_overlay:1,width:480,height:270,title:Picture-in-Picture

# Communication on tag 7 (opens silently)
window_rule=tags:7,is_tag_silent:1,app_id:com.rtosta.zapzap
window_rule=tags:7,is_tag_silent:1,app_id:org.telegram.desktop
window_rule=tags:7,is_tag_silent:1,app_id:vesktop
