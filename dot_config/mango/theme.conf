# Window effect
blur=0
blur_layer=0

cursor_size=26
cursor_theme=vimix-kanagawa-cursors-lotus

shadows = 1
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0

focused_opacity=1.0
unfocused_opacity=1.0

# Animation Configuration(support type:zoom,slide)
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.3
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=400
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Appearance
gappih=5
gappiv=5
gappoh=10
gappov=10

scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9

# Borders
borderpx=2
border_radius=6
no_radius_when_single=0

# --- BIRDS OF PARADISE COLORS (Updated) ---
# Format: 0xRRGGBBAA (Alpha FF = opaque)

shadowscolor=0x000000aa       # Shadow (Black with opacity)
rootcolor=0x2a1e1dff          # Background (Your #2a1e1d)
bordercolor=0x573d25ff        # Border (Your cursor color #573d25)
focuscolor=0x5a86acff         # Focused Window (Your Blue #5a86ac)
urgentcolor=0xbe2d26ff        # Urgent/Error (Your Red #be2d26)
globalcolor=0xab80a6ff        # Global/Accent (Your Magenta #ab80a6)
overlaycolor=0x6ba08aff       # Overlay/Success (Your Green #6ba08a)
scratchpadcolor=0xe99c29ff    # Scratchpad (Your Yellow #e99c29)
maximizescreencolor=0xdfdab7ff # Maximized Text/Highlight (Your Foreground #dfdab7)
